<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4f4f2"><title>AIMS | 게임 선택</title><link rel="stylesheet" href="assets/kiosk.css"><link rel="stylesheet" href="touch-center.css"><script src="touch-center.js" defer></script></head>
<body><main id="kiosk">
<section id="menu" class="menu">
  <header class="menu-brand"><img src="assets/aims-logo.png" alt="AIMS"><span>FINTECH WEEK</span></header>
  <div class="menu-title"><h1>게임 선택</h1></div>
  <div class="game-choices">
    <button class="game-choice" disabled data-open="paper"><span class="choice-icon"><svg viewBox="0 0 190 150" aria-hidden="true"><rect x="37" y="15" width="92" height="116" rx="5" transform="rotate(-10 37 15)" fill="white" stroke="#999" stroke-width="2"/><path d="M48 45H108M48 59H105M48 73H98M48 98H105" stroke="#a7a7a7" stroke-width="3"/><rect x="68" y="25" width="92" height="116" rx="5" transform="rotate(7 68 25)" fill="#fff" stroke="#222" stroke-width="2"/><path d="M87 59H143M87 75H143M87 91H143M87 107H128" stroke="#bbb" stroke-width="3"/><circle cx="141" cy="107" r="13" stroke="#171717" stroke-width="3" fill="none"/></svg></span><span class="choice-copy"><strong>PAPER RACE</strong><small>두 서류에서 서로 다른 내용을 찾으세요.</small></span><span class="choice-go" aria-hidden="true">→</span></button>
    <button class="game-choice" disabled data-open="scan"><span class="choice-icon"><svg viewBox="0 0 190 150" aria-hidden="true"><rect x="48" y="19" width="94" height="112" rx="3" fill="white" stroke="#9d9d9d" stroke-width="2"/><path d="M61 46H126M61 61H126M61 75H126M61 90H119" stroke="#bbb" stroke-width="3"/><path d="M29 42V12H62M160 42V12H127M29 108V138H62M160 108V138H127" fill="none" stroke="#151515" stroke-width="7" stroke-linecap="round"/><path d="M16 76H173" stroke="#E96643" stroke-width="3"/></svg></span><span class="choice-copy"><strong>ONE SHOT SCAN</strong><small>영수증이 테두리에 맞을 때 눌러 촬영하세요.</small></span><span class="choice-go" aria-hidden="true">→</span></button>
  </div>
</section>
<section id="play" class="play" hidden></section>
<section id="handoff" class="handoff" hidden><h2>이전 참가자의 차례가 종료됐습니다.</h2><button id="next-player">다음 참가자 →</button></section>
<dialog id="exit-dialog" class="exit-dialog"><h2>게임 선택 화면으로 이동할까요?</h2><p>진행 중인 게임은 종료됩니다.</p><div><button id="exit-cancel" autofocus>게임 계속</button><button id="exit-confirm">차례 종료</button></div></dialog>
</main></body></html>
