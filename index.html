<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4f4f2"><title>AIMS GAME CENTER · TOUCH</title><link rel="stylesheet" href="touch-center.css"><script src="touch-center.js" defer></script></head>
<body><main id="kiosk">
<section id="menu" class="menu">
  <header class="menu-brand"><img src="assets/aims-logo.png" alt="AIMS"><span>FINTECH WEEK · GAME CENTER</span></header>
  <div class="menu-title"><p>CHOOSE A GAME</p><h1>게임을 선택하세요.</h1></div>
  <div class="game-choices">
    <button class="game-choice" data-open="paper"><span class="choice-no">01</span><span class="choice-icon"><svg viewBox="0 0 190 150" aria-hidden="true"><rect x="37" y="15" width="92" height="116" rx="5" transform="rotate(-10 37 15)" fill="white" stroke="#999" stroke-width="2"/><path d="M48 45H108M48 59H105M48 73H98M48 98H105" stroke="#a7a7a7" stroke-width="3"/><rect x="68" y="25" width="92" height="116" rx="5" transform="rotate(7 68 25)" fill="#fff" stroke="#222" stroke-width="2"/><path d="M87 59H143M87 75H143M87 91H143M87 107H128" stroke="#bbb" stroke-width="3"/><circle cx="141" cy="107" r="13" stroke="#171717" stroke-width="3" fill="none"/></svg></span><span class="choice-copy"><strong>PAPER RACE</strong><small>보험 서류 속 다른 정보 찾기</small></span><span class="choice-go">선택 →</span></button>
    <button class="game-choice" data-open="scan"><span class="choice-no">02</span><span class="choice-icon"><svg viewBox="0 0 190 150" aria-hidden="true"><rect x="48" y="19" width="94" height="112" rx="3" fill="white" stroke="#9d9d9d" stroke-width="2"/><path d="M61 46H126M61 61H126M61 75H126M61 90H119" stroke="#bbb" stroke-width="3"/><path d="M29 42V12H62M160 42V12H127M29 108V138H62M160 108V138H127" fill="none" stroke="#151515" stroke-width="7" stroke-linecap="round"/><path d="M16 76H173" stroke="#E96643" stroke-width="3"/></svg></span><span class="choice-copy"><strong>ONE SHOT SCAN</strong><small>순간을 맞춰 3단계 클리어</small></span><span class="choice-go">선택 →</span></button>
  </div><p class="menu-foot">화면을 터치해 게임을 선택하세요.</p>
</section>
<section id="play" class="play" hidden><iframe id="game-frame" title="선택한 게임" allow="fullscreen" loading="eager"></iframe><button id="menu-back" aria-label="게임 선택 화면으로" class="menu-back">〈 게임 선택</button></section>
<dialog id="exit-dialog" class="exit-dialog"><h2>게임 선택 화면으로 이동할까요?</h2><p>진행 중인 게임은 종료됩니다.</p><div><button id="exit-cancel">취소</button><button id="exit-confirm">이동</button></div></dialog>
</main></body></html>
